<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Enrollment | Justine Paul Sumayang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="form-card">
      <div class="brand">STUDENT PORTAL</div>
      <h1>Student Enrollment</h1>
      <p class="subtitle">Fill in your information to register for a course.</p>

      <form id="enrollmentForm" novalidate>
        <div class="field">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" value="Justine Paul Sumayang" required>
          <small class="error" id="nameError"></small>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
          <small class="error" id="emailError"></small>
        </div>

        <div class="field">
          <label for="course">Course</label>
          <select id="course" name="course" required>
            <option value="">Select your course</option>
            <option>BS Computer Science</option>
            <option>BS Information Technology</option>
            <option>BS Information Systems</option>
            <option>BS Computer Engineering</option>
            <option>Other</option>
          </select>
          <small class="error" id="courseError"></small>
        </div>

        <div class="field">
          <label for="yearLevel">Year Level</label>
          <select id="yearLevel" name="yearLevel" required>
            <option value="">Select year level</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
          </select>
          <small class="error" id="yearError"></small>
        </div>

        <button type="submit">Submit Enrollment</button>
        <p class="form-note">Please review your details before submitting.</p>
      </form>

      <section id="summary" class="summary hidden" aria-live="polite">
        <h2>Enrollment Summary</h2>
        <p><strong>Name:</strong> <span id="summaryName"></span></p>
        <p><strong>Email:</strong> <span id="summaryEmail"></span></p>
        <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
        <p><strong>Year Level:</strong> <span id="summaryYear"></span></p>
        <p class="success">Enrollment form submitted successfully!</p>
      </section>
    </section>
    <footer>Designed by Justine Paul Sumayang</footer>
  </main>

  <script>
    const form = document.getElementById('enrollmentForm');
    const summary = document.getElementById('summary');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      let valid = true;
      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const course = document.getElementById('course').value;
      const year = document.getElementById('yearLevel').value;

      document.querySelectorAll('.error').forEach(el => el.textContent = '');
      document.querySelectorAll('input, select').forEach(el => el.classList.remove('invalid'));

      if (!name) {
        document.getElementById('nameError').textContent = 'Please enter your full name.';
        document.getElementById('fullName').classList.add('invalid');
        valid = false;
      }
      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        document.getElementById('emailError').textContent = 'Please enter a valid email address.';
        document.getElementById('email').classList.add('invalid');
        valid = false;
      }
      if (!course) {
        document.getElementById('courseError').textContent = 'Please select a course.';
        document.getElementById('course').classList.add('invalid');
        valid = false;
      }
      if (!year) {
        document.getElementById('yearError').textContent = 'Please select your year level.';
        document.getElementById('yearLevel').classList.add('invalid');
        valid = false;
      }

      if (!valid) {
        summary.classList.add('hidden');
        return;
      }

      document.getElementById('summaryName').textContent = name;
      document.getElementById('summaryEmail').textContent = email;
      document.getElementById('summaryCourse').textContent = course;
      document.getElementById('summaryYear').textContent = year;
      summary.classList.remove('hidden');
      summary.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  </script>
</body>
</html>
